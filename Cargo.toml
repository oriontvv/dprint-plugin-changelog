[package]
name = "dprint-plugin-changelog"
version = "0.1.0"
authors = ["dprint-plugin-changelog contributors"]
edition = "2021"
license = "Apache-2.0"
description = "Linter and formatter for Keep a Changelog CHANGELOG.md files, as a dprint plugin."
repository = "https://github.com/oriontvv/dprint-plugin-changelog"
keywords = ["dprint", "changelog", "keep-a-changelog", "formatter", "linter"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

[dependencies]
dprint-core = { version = "0.70.0", default-features = false }
parse-changelog = { version = "0.6.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
dprint-development = "0.12.1"
serde_json = "1"
